plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    constraints {
        api 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.16'
        api 'com.baomidou:mybatis-plus-jsqlparser:3.5.16'
        // 与 mybatis-plus 3.5.16 传递进来的版本对齐，供只要拦截器 API 的模块单独引用
        api 'org.mybatis:mybatis:3.5.19'
        api 'io.minio:minio:8.4.3'
        api 'org.locationtech.jts:jts-core:1.18.2'
        api 'org.testcontainers:junit-jupiter:1.20.6'
        api 'com.redis:testcontainers-redis:2.2.2'

        api "cn.miniants.platform:platform-core:${version}"
        api "cn.miniants.platform:platform-core-webmvc:${version}"
        api "cn.miniants.platform:platform-core-webflux:${version}"
        api "cn.miniants.platform:platform-data:${version}"
        api "cn.miniants.platform:platform-security:${version}"
        api "cn.miniants.platform:platform-admin:${version}"
        api "cn.miniants.platform:platform-tenant:${version}"
        api "cn.miniants.platform:platform-observability:${version}"
        api "cn.miniants.platform:platform-integration:${version}"
        api "cn.miniants.platform:platform-storage:${version}"
        api "cn.miniants.platform:platform-starter:${version}"
        api "cn.miniants.platform:platform-starter-webflux:${version}"
        api "cn.miniants.platform:platform-ops:${version}"
        api "cn.miniants.platform:platform-queue:${version}"
        api "cn.miniants.platform:platform-ratelimit-core:${version}"
        api "cn.miniants.platform:platform-ratelimit-redis:${version}"
        api "cn.miniants.platform:platform-ratelimit-webmvc:${version}"
        api "cn.miniants.platform:platform-ratelimit-webflux:${version}"
        api "cn.miniants.platform:platform-ratelimit-admin:${version}"
        api "cn.miniants.platform:platform-ratelimit-admin-ui:${version}"
    }
}
